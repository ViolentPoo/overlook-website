name: Report a bug
description: Tell us about a problem you encountered while using OVERLOOK.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OVERLOOK. Search existing issues before continuing.

        This report is public. Do not include passwords, access tokens, private server addresses, personal account information, or sensitive logs.
  - type: input
    id: summary
    attributes:
      label: Problem summary
      description: In one sentence, what went wrong?
      placeholder: The program guide does not open after selecting Live TV
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Tell us what you experienced in your own words.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that led to the problem. Approximate steps are fine.
      placeholder: |
        1. Open OVERLOOK
        2. Choose Live TV
        3. Select Guide
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: overlook-version
    attributes:
      label: OVERLOOK version
      description: Find this in the application information screen, if available.
      placeholder: "Example: 1.2.3"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android TV device model
      placeholder: "Example: NVIDIA Shield TV"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Android TV OS version
      placeholder: "Example: Android TV 11"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag reviewed images here. Remove personal or private information first.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic information (optional)
      description: Add only relevant, reviewed details. Never include credentials, tokens, private addresses, or unreviewed logs.
  - type: checkboxes
    id: safety
    attributes:
      label: Public information check
      options:
        - label: I have checked that this report does not contain passwords, tokens, private server addresses, personal account information, or other sensitive details.
          required: true
